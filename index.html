<style>@font-face{font-family:Vazirmatn;src:url(lib/Vazirmatn.woff2) format("woff2");font-weight:100 900}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#000;font:14px/1.4 Roboto,system-ui,Arial,sans-serif;color:#212121;overflow:hidden;touch-action:manipulation}
[hidden]{display:none!important}button{font:inherit;cursor:pointer}
#v,#c{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
#mapw{position:fixed;inset:0;z-index:3;background:#e5e3df}#map{position:absolute;inset:0}

.li{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid #eee}.li.a{font-weight:700;background:#f2f7ff;padding:8px 4px;margin-top:6px;border-radius:6px}.li small{color:#666}

#dlg label{display:flex;align-items:center;gap:8px;margin:8px 0}#dlg input[type=text],#dlg select,#dlg input[type=number]{flex:1;padding:8px;border:1px solid #bbb;border-radius:6px;font-size:15px;min-width:0}

#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2300;background:#323232;color:#fff;padding:10px 16px;border-radius:6px;max-width:88vw;text-align:center}
#top{position:fixed;top:calc(56px + env(safe-area-inset-top,0px));left:0;right:0;z-index:5;padding:4px 10px;font-size:12px;background:#0008;color:#fff;text-align:center}#dbg{font-size:11px;opacity:.8}

.pad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,40px);gap:5px}.pad button:nth-child(1){grid-column:2}

#set{position:fixed;left:10px;right:10px;bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:2060;background:#fff;border-radius:12px;padding:12px;box-shadow:0 4px 18px #0007}#set label{display:flex;align-items:center;gap:8px;margin:7px 0}#set input[type=range]{flex:1}#set b{min-width:30px;text-align:right}
#st{position:fixed;inset:0;z-index:2150;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px}#stc0{background:#fff;border-radius:10px;padding:18px;max-width:420px;width:100%}#stc0 h3{margin:0 0 8px}#stc0 p{margin:0 0 12px;color:#444}#stc0 button{display:block;width:100%;margin:6px 0;padding:12px;border-radius:6px;border:1px solid #1565c0;background:#fff;color:#1565c0;font-weight:700;text-transform:uppercase}#stc0 #go{background:#1565c0;color:#fff}

<div id="mapw"><div id="map"></div><div class="fabs"><button class="fab" id="fx" title="Zoom to project">⤢</button><button class="fab" id="fl2" title="My location">◎</button></div></div>

<div id="sheet" hidden></div><div id="dlgw" hidden><div id="dlg"></div></div><div id="toast" hidden></div>
<div id="st" hidden><div id="stc0"><h3>Start AR</h3><p>The camera, location and motion sensors are used to overlay your layers on the real world.</p><button id="go">Start AR with GPS</button><button id="sim">Simulate at project (no GPS)</button><button id="stc">Cancel</button></div></div>
<input id="fl" type="file" accept=".geojson,.json,.kml,.zip" hidden><input id="fb" type="file" accept=".json" hidden>
<script>

const $=id=>document.getElementById(id),v=$('v'),cv=$('c'),ctx=cv.getContext('2d'),mm=$('mm'),mx=mm.getContext('2d');
const S={sim:0,off:[0,0],a:0,b:90,g:0,yf:0,abs:0,cmp:null,ok:0,depth:0,under:0,pt:0,plan:1,started:0,sa:0,eye:1.5,fov:66,step:2,P:null,acc:0,zn:0,nocam:0};
let MAP,GL,UM,W,H,DB={projects:[{id:'p1',n:'Project 1',areas:[]}],cur:0},REF=[0,0],C=[0,0],TY={};const D={pl:[],tx:[],mh:[]};
function rs(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);rs();
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const xy=(lo,la)=>[(lo-REF[0])*111320*Math.cos(REF[1]*Math.PI/180),(la-REF[1])*110574];
const idb=()=>new Promise((r,j)=>{const q=indexedDB.open('arl',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
function wire(){if(!DB.projects)DB={projects:[{id:'p1',n:'Project 1',areas:DB.areas||[]}],cur:0};if(!DB.projects.length)DB.projects.push({id:'p'+Date.now().toString(36),n:'Project 1',areas:[]});if(!(DB.cur>=0&&DB.cur<DB.projects.length))DB.cur=0;Object.defineProperty(DB,'areas',{get(){return DB.projects[DB.cur].areas},enumerable:false,configurable:true})}wire();
async function load(){try{const d=await idb();DB=await new Promise(r=>{const q=d.transaction('k').objectStore('k').get('db');q.onsuccess=()=>r(q.result||{areas:[]});q.onerror=()=>r({areas:[]})});wire()}catch(e){}}
async function save(){try{const d=await idb();d.transaction('k','readwrite').objectStore('k').put(DB,'db')}catch(e){}}
function setArea(i){S.sa=i;const a=DB.areas[i];REF=a&&a.L.length?a.c.slice():[0,0];C=[0,0];rebuild();if(S.ll)S.P=xy(S.ll[0],S.ll[1])}
function rebuild(){TY={};D.pl=[];D.tx=[];D.mh=[];DB.areas.forEach(a=>{if(!a.on)return;a.L.forEach(l=>{TY[l.id]=l;if(!l.on)return;const g=l.g;
 g.l.forEach(p=>{const q=[];for(let i=0;i<p.length;i+=2)q.push(...xy(p[i],p[i+1]));D.pl.push({l:'pipe',p:q,k:l.id})});
 g.t.forEach(t=>{const q=xy(t.x,t.y);D.tx.push({t:t.t,x:q[0],y:q[1],d:0,k:l.id})});
 g.p.forEach(m=>{const q=xy(m[0],m[1]);D.mh.push([q[0],q[1],l.id])})})});S.cnt=D.pl.length+D.tx.length+D.mh.length}
function onGps(p){const lo=p.coords.longitude,la=p.coords.latitude;S.acc=p.coords.accuracy;S.ll=[lo,la];let bi=-1,bd=1e18;
 DB.areas.forEach((a,i)=>{if(!a.on||!a.L.length)return;const q=Math.hypot((lo-a.c[0])*Math.cos(la*Math.PI/180),la-a.c[1]);if(q<bd){bd=q;bi=i}});
 if(bi>=0&&bi!==S.sa)setArea(bi);const n=xy(lo,la);S.P=S.P&&Math.hypot(n[0]-S.P[0],n[1]-S.P[1])<30?[S.P[0]+(n[0]-S.P[0])*.35,S.P[1]+(n[1]-S.P[1])*.35]:n;
 $('chip').textContent='GPS ±'+S.acc.toFixed(0)+' m';if(MAP)planUser()}
function getP(){if(S.sim)return[C[0]+S.off[0],C[1]+S.off[1]];return S.P?[S.P[0]+S.off[0],S.P[1]+S.off[1]]:null}
function mat(yf){const r=Math.PI/180,al=(S.a-yf)*r,be=(S.b+S.pt)*r,ga=S.g*r,cA=Math.cos(al),sA=Math.sin(al),cB=Math.cos(be),sB=Math.sin(be),cG=Math.cos(ga),sG=Math.sin(ga);
 return[[cA*cG-sA*sB*sG,-cB*sA,cG*sA*sB+cA*sG],[cG*sA+cA*sB*sG,cA*cB,sA*sG-cA*cG*sB],[-cB*sG,sB,cB*cG]]}
const head=M=>(Math.atan2(-M[0][2],-M[1][2])*180/Math.PI+360)%360;
function onOri(e){if(e.type==='deviceorientation'&&S.abs)return;if(e.alpha==null)return;
 if(e.type==='deviceorientationabsolute')S.abs=1;
 S.a=e.alpha;S.b=e.beta;S.g=e.gamma;S.ok=1;S.drag=0;
 if(e.webkitCompassHeading!=null&&!S.abs&&S.b>50&&S.b<130){const d=((e.webkitCompassHeading-head(mat(0))+540)%360)-180;
  S.yf=S.yfi?S.yf+(((d-S.yf+540)%360)-180)*.15:d;S.yfi=1}}
function dseg(px,py,ax,ay,bx_,by){const dx=bx_-ax,dy=by-ay,t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy||1)));return Math.hypot(px-ax-t*dx,py-ay-t*dy)}
function nearest(P){let m=1e9;D.pl.forEach(l=>{if(l.l!=='pipe')return;for(let i=0;i<l.p.length-2;i+=2)m=Math.min(m,dseg(P[0],P[1],l.p[i],l.p[i+1],l.p[i+2],l.p[i+3]))});return m}
function draw(){
 ctx.clearRect(0,0,W,H);mx.clearRect(0,0,220,220);
 const M=mat(S.yf),hd=head(M),P=getP(),an=(screen.orientation?screen.orientation.angle:window.orientation)||0;
 $('dbg').textContent=(S.err||'ok')+' | video '+v.videoWidth+'x'+v.videoHeight+' rs'+v.readyState;if(S.nocam&&!v.srcObject){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1e293b');g.addColorStop(1,'#0b1220');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
 if(!P){$('info').textContent='Waiting for GPS…';const w0=$('warn');w0.hidden=0;w0.textContent=S.nocam?'Camera could not start. Open the link directly in Chrome/Safari and allow camera access.':'Waiting for a GPS fix. Allow Location access (and go outside), or tap Simulate.';return}
 const F=Math.max(W,H)/2/Math.tan(S.fov*Math.PI/360),zp=-(S.eye+S.depth),zg=-S.eye,N=.2;
 const pr=(x,y,z)=>{const wx=x-P[0],wy=y-P[1],wz=z,dx=M[0][0]*wx+M[1][0]*wy+M[2][0]*wz,dy=M[0][1]*wx+M[1][1]*wy+M[2][1]*wz,dz=M[0][2]*wx+M[1][2]*wy+M[2][2]*wz;let r=dx,u=dy;
  if(an==90){r=-dy;u=dx}else if(an==270||an==-90){r=dy;u=-dx}else if(an==180){r=-dx;u=-dy}return[r,u,-dz]};
 const sc=p=>[W/2+F*p[0]/p[2],H/2-F*p[1]/p[2]];
 const seg=(a,b)=>{if(a[2]<N&&b[2]<N)return;if(a[2]<N){const t=(N-a[2])/(b[2]-a[2]);a=a.map((q,i)=>q+(b[i]-q)*t)}else if(b[2]<N){const t=(N-b[2])/(a[2]-b[2]);b=b.map((q,i)=>q+(a[i]-q)*t)}
  const s=sc(a),e=sc(b);ctx.moveTo(s[0],s[1]);ctx.lineTo(e[0],e[1])};
 const poly=(pts,z,col,w,dash)=>{for(const pass of[0,1]){ctx.beginPath();ctx.setLineDash(dash||[]);ctx.lineCap='round';ctx.strokeStyle=pass?col:'#000a';ctx.lineWidth=pass?w:w+3;
  for(let i=0;i<pts.length-2;i+=2)seg(pr(pts[i],pts[i+1],z),pr(pts[i+2],pts[i+3],z));ctx.stroke()}ctx.setLineDash([])};
 const txt=(s,p,col,size,bold)=>{if(p[2]<.5||p[2]>150)return;const q=sc(p);if(q[0]<-50||q[0]>W+50||q[1]<-20||q[1]>H+20)return;
  const fs=Math.max(11,Math.min(20,size*40/p[2]));ctx.font=(bold?'700 ':'')+fs+'px Vazirmatn,sans-serif';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#000c';ctx.strokeText(s,q[0],q[1]);ctx.fillStyle=col;ctx.fillText(s,q[0],q[1])};
 const zk=k=>-(S.eye+(S.under?TY[k].d+S.depth:0));D.pl.forEach(l=>l.l==='tr'?poly(l.p,zk(l.k),'#fbbf24',1.5,[8,6]):poly(l.p,zk(l.k),TY[l.k].c,TY[l.k].w||4));
 D.tx.forEach(t=>txt(t.t,pr(t.x,t.y,zk(t.k)),t.d?'#fbbf24':'#fff',t.d?11:13,!t.d));
 D.mh.forEach(m=>{const g=pr(m[0],m[1],zg),b=pr(m[0],m[1],zk(m[2]));ctx.beginPath();seg(g,b);ctx.strokeStyle='#f472b6';ctx.lineWidth=2;ctx.stroke();
  const ring=[];for(let i=0;i<=24;i++){const t=i/24*6.2832;ring.push(m[0]+.6*Math.cos(t),m[1]+.6*Math.sin(t))}poly(ring,zg,'#f472b6',3);
  const dd=Math.hypot(m[0]-P[0],m[1]-P[1]);txt(TY[m[2]].n+' · '+dd.toFixed(0)+' m',pr(m[0],m[1],zg+1.2),'#f9a8d4',14,1)});
 // minimap
 const h=hd*Math.PI/180;
 const K=2.2*55/80*1.0;const m2=(x,y)=>{const dx=x-P[0],dy=y-P[1];return[110+K*(dx*Math.cos(h)-dy*Math.sin(h)),110-K*(dx*Math.sin(h)+dy*Math.cos(h))]};
 mx.save();mx.beginPath();mx.arc(110,110,108,0,7);mx.clip();
 D.pl.forEach(l=>{mx.beginPath();for(let i=0;i<l.p.length;i+=2){const q=m2(l.p[i],l.p[i+1]);i?mx.lineTo(q[0],q[1]):mx.moveTo(q[0],q[1])}mx.strokeStyle=l.l==='tr'?'#fbbf24':TY[l.k].c;mx.lineWidth=l.l==='tr'?1:3;mx.stroke()});
 D.mh.forEach(m=>{const q=m2(m[0],m[1]);mx.fillStyle='#f472b6';mx.beginPath();mx.arc(q[0],q[1],5,0,7);mx.fill()});mx.restore();
 const dc=Math.hypot(C[0]-P[0],C[1]-P[1]);
 if(dc*K>100){const q=m2(C[0],C[1]),a=Math.atan2(q[1]-110,q[0]-110);mx.save();mx.translate(110+90*Math.cos(a),110+90*Math.sin(a));mx.rotate(a);mx.fillStyle='#f87171';mx.beginPath();mx.moveTo(12,0);mx.lineTo(-8,-9);mx.lineTo(-8,9);mx.fill();mx.restore()}
 mx.fillStyle='#fff';mx.beginPath();mx.moveTo(110,98);mx.lineTo(102,118);mx.lineTo(118,118);mx.fill();
 const nd=nearest(P);
 $('info').textContent='Heading '+(hd|0)+'° · '+(S.sim?'Simulated':'GPS ±'+S.acc.toFixed(0)+' m')+' · Items '+S.cnt+' · Nearest line '+(nd<1e8?nd.toFixed(0)+' m':'-');
 const w=$('warn');let msg=DB.areas.some(x=>x.L.length)?'':'Add an area and import a layer first (menu ☰ → Import layer).';
 if(S.nocam)msg='Camera could not start. Open the link directly in Chrome/Safari and allow camera access. Showing a dark background for now.';else if(dc>400)msg='Project center is '+(dc>1000?(dc/1000).toFixed(1)+' km':dc.toFixed(0)+' m')+'Simulated';
 else if(S.nocam)msg='Camera unavailable. Open the link directly in your browser and allow camera access.';
 else if(S.ok&&!S.abs&&S.cmp==null&&!S.sim&&!S.warned)msg='Absolute compass not available on this device; directions may be wrong.';
 w.hidden=!msg;w.textContent=msg}
function loop(){if(!S.plan)draw();requestAnimationFrame(loop)}

function fixC(a){let b=null;a.L.forEach(l=>{b=b?[Math.min(b[0],l.b[0]),Math.min(b[1],l.b[1]),Math.max(b[2],l.b[2]),Math.max(b[3],l.b[3])]:l.b.slice()});a.c=b?[(b[0]+b[2])/2,(b[1]+b[3])/2]:[0,0]}
function bbox(o){let b=[1e9,1e9,-1e9,-1e9];const u=(x,y)=>{b=[Math.min(b[0],x),Math.min(b[1],y),Math.max(b[2],x),Math.max(b[3],y)]};o.l.forEach(a=>{for(let i=0;i<a.length;i+=2)u(a[i],a[i+1])});o.p.forEach(p=>u(p[0],p[1]));o.t.forEach(t=>u(t.x,t.y));return b}
function feats(gj,out){const rr=x=>Math.round(x*1e6)/1e6,ln=c=>{const a=[];c.forEach(q=>a.push(rr(q[0]),rr(q[1])));if(a.length>3)out.l.push(a)};
 const g=(G,pr)=>{if(!G)return;const c=G.coordinates;switch(G.type){case'Point':{const lb=pr&&pr.label,nm=pr&&(pr.name||pr.Name||pr.NAME);if(!lb)out.p.push([rr(c[0]),rr(c[1])]);if(lb||nm)out.t.push({t:String(lb||nm).slice(0,30),x:rr(c[0]),y:rr(c[1])});break}
  case'MultiPoint':c.forEach(q=>g({type:'Point',coordinates:q},pr));break;case'LineString':ln(c);break;case'MultiLineString':c.forEach(ln);break;case'Polygon':c.forEach(ln);break;case'MultiPolygon':c.forEach(p=>p.forEach(ln));break;case'GeometryCollection':G.geometries.forEach(x=>g(x,pr))}};
 (Array.isArray(gj)?gj:[gj]).forEach(j=>{const f=j.type==='FeatureCollection'?j.features:j.type==='Feature'?[j]:[{geometry:j,properties:{}}];f.forEach(x=>g(x.geometry,x.properties))})}
// ---- UI helpers

function drawPlan(){if(!MAP)return;GL.clearLayers();const bs=[],z=MAP.getZoom();
 DB.areas.forEach(a=>{if(!a.on)return;a.L.forEach(l=>{if(!l.on)return;const g=l.g;
  g.l.forEach(p=>{const q=[];for(let i=0;i<p.length;i+=2)q.push([p[i+1],p[i]]);L.polyline(q,{color:l.c,weight:l.w||4}).bindTooltip(esc(a.n)+' · '+esc(l.n)).addTo(GL);bs.push(...q)});
  g.p.forEach(m=>{L.circleMarker([m[1],m[0]],{radius:5,color:l.c,weight:2,fillColor:'#fff',fillOpacity:.9}).bindTooltip(esc(l.n)).addTo(GL);bs.push([m[1],m[0]])});
  g.t.forEach(t=>bs.push([t.y,t.x]));if(z>=18)g.t.forEach(t=>L.marker([t.y,t.x],{icon:L.divIcon({className:'lb',html:esc(t.t)}),interactive:false}).addTo(GL))})});
 if(bs.length&&!S.fit){S.fit=1;MAP.fitBounds(bs,{maxZoom:19,padding:[40,40]})}planUser()}

function anchor(){const raw=S.sim?[0,0]:S.P;if(!raw){toast('GPS position not ready yet');return}let b=null,bd=1e18;const t=(x,y)=>{const d=Math.hypot(x-raw[0],y-raw[1]);if(d<bd){bd=d;b=[x,y]}};D.mh.forEach(m=>t(m[0],m[1]));if(!b)D.pl.forEach(l=>{for(let i=0;i<l.p.length;i+=2)t(l.p[i],l.p[i+1])});if(!b){toast('No visible features to snap to');return}S.off=[b[0]-raw[0],b[1]-raw[1]];toast('Position snapped to the nearest point (was '+bd.toFixed(0)+' m away)')}

 q('[data-p]',e=>e.onchange=()=>{DB.cur=+e.dataset.p;sw();projects()});

 p.areas.map((a,i)=>`<div class='li a'><input type=checkbox data-a=${i} ${a.on?'checked':''}><span style='flex:1'>${esc(a.n)}</span><button class=tb data-ad=${i}>+ Layer</button><button class=tb data-ae=${i}>Edit</button></div>`+a.L.map((l,j)=>`<div class=li data-lp=${i}_${j}><input type=checkbox data-l=${i}_${j} ${l.on?'checked':''}><span class=sw style='background:${l.c}'></span><span style='flex:1'>${esc(l.n)}</span><small>${l.d} m</small></div>`).join('')).join('');
 const q=(sel,f)=>s.querySelectorAll(sel).forEach(f),ij=e=>e.split('_').map(Number),chg=()=>{save();rebuild();drawPlan();refresh()};
 $('sxx').onclick=()=>s.hidden=1;$('sna').onclick=()=>ask('New area name','',n=>{DB.areas.push({n,on:1,c:[0,0],L:[]});save();refresh();sheet()});

 q('[data-lp]',e=>e.onclick=()=>{const[i,j]=ij(e.dataset.lp);layerDlg(i,j)});
 q('[data-ad]',e=>e.onclick=()=>{S.tgt=+e.dataset.ad;$('fl').click()});q('[data-ae]',e=>e.onclick=()=>areaDlg(+e.dataset.ae))}
function areaDlg(i){const a=DB.areas[i];dlgShow(`<h3>Area</h3><label>Name <input type=text id=an2 value='${esc(a.n)}'></label><div class=act><button id=ax style='color:#c62828'>Delete</button><button id=acn>Cancel</button><button class=pr id=aok>Save</button></div>`);
 $('acn').onclick=dlgClose;$('aok').onclick=()=>{a.n=$('an2').value||a.n;dlgClose();save();refresh();sheet()};

function impStart(){if(!DB.areas.length){toast('Create an area first (Layers → + Area)');sheet();return}S.tgt=S.sa<DB.areas.length?S.sa:0;$('fl').click()}
$('fl').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const ext=f.name.split('.').pop().toLowerCase();let gj,crs;
 try{if(ext==='zip'){const buf=await f.arrayBuffer();if(!/\.prj/i.test(new TextDecoder('latin1').decode(new Uint8Array(buf))))throw new Error('This Shapefile ZIP has no .prj file, so its coordinate system is unknown. Add the .prj file and try again.');gj=await shp(buf);crs='read from .prj, converted to WGS 84'}

 catch(x){dlgShow(`<h3>Cannot import</h3><p>${esc(x.message)}</p><div class=act><button class=pr id=oc>OK</button></div>`);$('oc').onclick=dlgClose;return}
 const nm=f.name.replace(/\.[^.]+$/,''),g=(GS.find(x=>x[0].test(nm))||[0,'Other'])[1];

 $('dt').onchange=()=>{const p=TYPES[$('dt').value];$('dc').value=p[0];$('dd').value=p[1]};$('dno').onclick=dlgClose;

  if(!out.l.length&&!out.p.length&&!out.t.length){toast('No geometry found in the file');return}

  const ai=+$('ia').value,a=DB.areas[ai];a.L.push({id:'l'+Date.now().toString(36),n:$('dn').value||nm,c:$('dc').value,d:+$('dd').value||0,on:1,w:+$('dw').value||4,g:out,b});fixC(a);dlgClose();save();setArea(ai);S.off=[0,0];S.fit=0;drawPlan();refresh();toast('Layer imported');if(!$('sheet').hidden)sheet()}};

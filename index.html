<style>@font-face{font-family:Vazirmatn;src:url(lib/Vazirmatn.woff2) format("woff2");font-weight:100 900}
:root{--bg:#fff;--fg:#212121;--mut:#666;--card:#fff;--line:#e0e0e0;--hl:#f2f7ff;--pri:#1565c0;--prt:#fff;--inp:#fff;--ib:#bbb;--bar:#1565c0;--dg:#c62828}

*{box-sizing:border-box}html,body{height:100%;margin:0;background:#000;font:14px/1.45 Roboto,system-ui,Arial,sans-serif;color:var(--fg);overflow:hidden;touch-action:manipulation}

[hidden]{display:none!important}button{font:inherit;cursor:pointer}input,select{font:inherit;color:var(--fg)}

#mapw{position:fixed;inset:0;z-index:3;background:#d6d4cf}#map{position:absolute;inset:0}#map.inv .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.95) contrast(.9)}
#bar{position:fixed;top:0;left:0;right:0;z-index:2000;height:calc(56px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);background:var(--bar);color:#fff;display:flex;align-items:center;gap:2px;box-shadow:0 2px 6px #0006;direction:ltr}
.ib{background:none;border:0;color:#fff;font-size:24px;width:48px;height:48px;display:flex;align-items:center;justify-content:center}

.fabs{position:absolute;right:14px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:1000;display:flex;flex-direction:column;gap:12px}
.fab{width:52px;height:52px;border-radius:50%;border:0;background:var(--card);color:var(--pri);font-size:24px;box-shadow:0 2px 8px #0006}
#chip{position:fixed;z-index:1999;left:10px;top:calc(66px + env(safe-area-inset-top,0px));background:var(--card);color:var(--fg);border-radius:14px;padding:3px 10px;font-size:12px;box-shadow:0 1px 4px #0005}

#drawer header{background:var(--bar);color:#fff;padding:calc(22px + env(safe-area-inset-top,0px)) 16px 16px}#drawer header b{font-size:20px}#drawer header div{opacity:.85;font-size:12px}
#drawer button{display:block;width:100%;text-align:start;background:none;border:0;padding:14px 18px;font-size:15px;color:var(--fg)}#drawer button:active{background:var(--hl)}#drawer hr{border:0;border-top:1px solid var(--line);margin:4px 0}
#sheet{position:fixed;top:calc(56px + env(safe-area-inset-top,0px));right:0;bottom:0;width:min(340px,90vw);overflow:auto;z-index:2050;background:var(--card);box-shadow:-3px 0 12px #0007;padding:6px 12px calc(12px + env(safe-area-inset-bottom,0px));animation:slin .2s}@keyframes slin{from{transform:translateX(100%)}to{transform:none}}
.li{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid var(--line)}.li.a{font-weight:700;background:var(--hl);padding:8px 4px;margin-top:6px;border-radius:6px}.li small{color:var(--mut)}

.sw{width:18px;height:18px;border-radius:4px;border:1px solid #0004;flex:none}
#dlgw{position:fixed;inset:0;z-index:2200;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px}

#dlg label{display:flex;align-items:center;gap:8px;margin:8px 0}#dlg input[type=text],#dlg select,#dlg input[type=number]{flex:1;padding:8px;border:1px solid var(--ib);background:var(--inp);border-radius:6px;font-size:15px;min-width:0}
#dlg input[type=color]{width:44px;height:30px;padding:0;border:0;background:none}.nt{font-size:12px;color:var(--mut)}
.act{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}.act button,.tb{background:none;border:0;color:var(--pri);font-weight:700;padding:8px 12px;text-transform:uppercase;font-size:13px}.act .pr{background:var(--pri);color:var(--prt);border-radius:6px}.act .dg{color:var(--dg)}.tb{padding:4px 8px;font-size:12px}
.at{border-collapse:collapse;font-size:12px}.at td,.at th{border:1px solid var(--line);padding:3px 6px;text-align:start;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2300;background:#323232;color:#fff;padding:10px 16px;border-radius:6px;max-width:88vw;text-align:center}
#wel{position:fixed;inset:0;z-index:2150;background:linear-gradient(#1565c0,#0d47a1);display:flex;align-items:center;justify-content:center;padding:20px;color:#fff;overflow:auto}.wc{width:100%;max-width:380px;text-align:center}.wc h2{font-size:30px;margin:0}.wc p{opacity:.85;margin:6px 0 22px}.wb{display:block;width:100%;margin:10px 0;padding:14px;border-radius:8px;border:0;background:#fff;color:#1565c0;font-size:15px}.wb small{display:block;color:#555;font-size:12px;margin-bottom:2px}.wb.pr{background:#ffb300;color:#212121}.lk{background:none;border:0;color:#fff;text-decoration:underline;margin-top:14px;font-size:14px}
#top{position:fixed;top:calc(56px + env(safe-area-inset-top,0px));left:0;right:0;z-index:5;padding:4px 10px;font-size:12px;background:#0008;color:#fff;text-align:center}#dbg{font-size:11px;opacity:.8;direction:ltr}
#mm{position:fixed;left:10px;top:calc(104px + env(safe-area-inset-top,0px));width:110px;height:110px;border-radius:50%;background:#0008;border:1px solid #fff5;z-index:5}
#warn{position:fixed;left:10px;right:10px;top:calc(226px + env(safe-area-inset-top,0px));z-index:5;background:#b45309e6;color:#fff;padding:8px 12px;border-radius:8px;font-size:13px}

#arc button{background:#0f172acc;color:#fff;border:1px solid #fff4;border-radius:10px;padding:8px 12px;font-size:14px}.side{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
#set{position:fixed;left:10px;right:10px;bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:2060;background:var(--card);color:var(--fg);border-radius:12px;padding:12px;box-shadow:0 4px 18px #0007}#set label{display:flex;align-items:center;gap:8px;margin:7px 0}#set input[type=range]{flex:1}#set b{min-width:30px;text-align:end}

Object.assign(I.en,{about:'About',dev:'Developer',ver:'Version',abIntro:'AR-Links shows underground utility layers — water, gas, electric, telecom, sewer — from your GIS files on a map and in augmented reality, using the phone camera, GPS and compass.',abPriv:'Your projects are stored only on this device. Nothing is uploaded to any server; only map tiles are downloaded from the internet.',abCred:'Built with Leaflet, shpjs and togeojson. Map data: © OpenStreetMap contributors, Esri World Imagery, OpenTopoMap.'});
Object.assign(I.fa,{about:'درباره‌ی برنامه',dev:'توسعه‌دهنده',ver:'نسخه',abIntro:'AR-Links لایه‌های تأسیسات زیرزمینی (آب، گاز، برق، مخابرات، فاضلاب) را از فایل‌های GIS شما روی نقشه و در واقعیت افزوده (AR) با استفاده از دوربین، GPS و قطب‌نمای گوشی نشان می‌دهد.',abPriv:'پروژه‌های شما فقط روی همین دستگاه ذخیره می‌شوند. هیچ داده‌ای به سرور ارسال نمی‌شود؛ فقط کاشی‌های نقشه از اینترنت دریافت می‌شوند.',abCred:'ساخته‌شده با Leaflet، shpjs و togeojson. داده‌ی نقشه: © مشارکت‌کنندگان OpenStreetMap، تصاویر ماهواره‌ای Esri و OpenTopoMap.'});
const HELP={en:[
['Quick start',`<ol><li>Open the app. On the first screen tap <b>Create new project</b> and type a name.</li><li>Open the layers panel (layers icon in the top bar) and tap <b>+ Area</b>.</li><li>On the area row tap <b>+ Layer</b> and choose a GeoJSON, KML or Shapefile (.zip with .prj) file.</li><li>Set name, type, color and depth, then tap <b>Import</b>. The layer appears on the map.</li><li>Tap <b>AR</b> in the top bar, then <b>Start AR with GPS</b>. Point the camera at the ground to see the layers.</li></ol>`],
['Top bar and main menu',`<ul><li><b>☰</b> opens the main menu: Projects, Close project, Layers, Import layer, Backup, Restore backup, Settings, About, Help.</li><li><b>Project name</b> (with area/layer counts): tap it to open the Projects list.</li><li><b>Layers icon</b>: opens or closes the layers panel on the right.</li><li><b>MAP | AR</b>: switches between the plan view on the map and the camera (AR) view.</li></ul>`],
['Projects, areas and layers',`<ul><li>A <b>project</b> holds one or more <b>areas</b>; an area holds <b>layers</b> (one file = one layer).</li><li><b>Projects</b> (menu): select, rename, delete or create projects. Deleting a project deletes all its areas and layers.</li><li><b>Close project</b> returns to the first screen: Open last project / Create new project / Choose from existing projects / Restore from backup.</li><li>Area row: checkbox shows or hides the whole area; <b>+ Layer</b> imports a file into it; <b>Edit</b> renames or deletes it.</li></ul>`],
['Importing layers',`<ul><li>Menu → <b>Import layer</b>, or <b>+ Layer</b> on an area row.</li><li>Supported: <b>GeoJSON</b> (WGS 84), <b>KML</b> (WGS 84), <b>Shapefile</b> as a .zip that contains the .prj file (any coordinate system, converted automatically).</li><li>Not supported: DXF, GPKG, TIFF and other formats that do not carry their own coordinate system. A Shapefile ZIP without .prj, or a GeoJSON declaring another CRS, is rejected with a message.</li><li>Import dialog: <b>Name</b>; <b>Area</b> to put the layer in; <b>Type</b> (Water, Gas, Electric, Telecom, Sewer, Other — sets a default color and depth); <b>Color</b>; <b>Line width</b>; <b>Depth</b> (meters below ground, used in AR). The line under the fields shows how the coordinate system was understood.</li><li>If the file has a field called label or name it is selected automatically as the label field.</li></ul>`],
['Converting other formats (QGIS)',`<ol><li>Open the file in QGIS and set the correct CRS (for example EPSG:32640 for UTM 40 N).</li><li>Right-click the layer → Export → Save Features As…</li><li>Choose <b>GeoJSON</b> with CRS EPSG:4326, or <b>ESRI Shapefile</b> (zip it together with the .prj).</li><li>Import the result into the app.</li></ol>`],
['Layers panel and basemaps',`<ul><li>The panel slides in from the right. <b>✕</b> closes it.</li><li><b>Basemap</b>: Streets (OpenStreetMap), Satellite (Esri), Hybrid (satellite + place names), Topo (OpenTopoMap), None (blank). Needs internet; tiles you already viewed are cached.</li><li>Layer row: checkbox = show/hide, colored square = layer color (a gradient square means categorized), 🏷 shows the label field, <b>⋮</b> or tapping the row opens the layer properties.</li></ul>`],
['Layer properties',`<ul><li><b>Name</b>, <b>Line width</b>, <b>Depth (m)</b> — used in AR only when <i>Show at real depth</i> is on.</li><li><b>Style → Single symbol</b>: one color for the whole layer.</li><li><b>Style → Categorized by attribute</b>: choose an attribute; every distinct value gets its own color, which you can change. <i>Default color</i> is used for features without a value.</li><li><b>Point marker</b>: Ring (shown in AR and on the map) or No marker (labels only).</li><li><b>Label by</b>: pick the attribute whose text is written next to each feature (map: zoom in to level 17 or more; AR: always, when within range). None turns labels off.</li><li><b>Attributes</b>: table of the first 150 features.</li><li><b>Zoom to</b> shows the layer on the map. <b>Delete</b> removes it. <b>Save</b> applies all changes.</li></ul>`],
['Map view',`<ul><li>Blue dot = your position. The chip at the top-left shows GPS accuracy (±m).</li><li><b>⤢</b> zooms to the whole project. <b>◎</b> centers on your location (asks for permission the first time).</li><li>Tap a line or point to see its attributes in a pop-up.</li><li>Pinch or double-tap to zoom; the scale bar is at the bottom-left.</li></ul>`],
['AR view: starting and screen',`<ul><li>Tap <b>AR</b>. On the first visit choose <b>Start AR with GPS</b> (real position) or <b>Simulate at project (no GPS)</b> (you stand at the center of the project and can walk with the arrow buttons; good for testing indoors). Allow camera, location and motion sensors.</li><li><b>Top info bar</b>: Heading (compass degrees), GPS accuracy or Simulated, number of items, distance to the nearest line.</li><li><b>Round mini map</b> (left): your view from above — white triangle = you, colored lines = layers, dots = points. A red arrow at its edge points to the project when it is far away.</li><li><b>Orange bar</b>: warnings (camera problem, GPS not ready, project far away, no compass).</li><li>Lines are drawn in their layer/category colors; rings mark points with a distance in meters; labels follow the “Label by” setting.</li></ul>`],
['AR buttons and settings',`<ul><li><b>▲ ▼ ◀ ▶</b> (bottom-left): move your position forward, back, left or right by the <i>Move step</i>, relative to where the camera looks. Use them to correct GPS error or to walk in Simulate mode.</li><li><b>Snap to nearest point</b>: places you exactly on the nearest visible point (or line vertex). Stand next to a known manhole first, then tap it.</li><li><b>Reset position</b>: removes all manual shifts.</li><li><b>Restart camera</b>: tries to open the camera again.</li><li><b>⚙ AR settings</b>: <i>Depth offset</i> (adds or subtracts depth for all layers — only has an effect when <i>Show at real depth</i> is on), <i>Eye height</i> (your phone height above ground), <i>Camera field of view</i> (increase if lines look too close together, decrease if too spread out), <i>Tilt trim</i> (corrects a constant up/down error), <i>Move step</i>, and <i>Show at real depth</i> (off = lines drawn on the ground surface; on = drawn underground at each layer’s depth).</li></ul>`],
['Settings, backup and restore',`<ul><li><b>Settings</b>: Language (English / فارسی) and Theme (System / Light / Dark). They are saved on this device.</li><li><b>Backup (JSON)</b> saves all projects to a file. <b>Restore backup</b> loads such a file (it replaces the current data).</li></ul>`],
['Getting good accuracy',`<ul><li>Phone GPS is accurate to only a few meters, sometimes much worse near buildings or under trees. Wait until the chip shows a small ± value.</li><li>Calibrate the compass by moving the phone in a figure-8 and stay away from metal and cars.</li><li>Stand beside a known point and use <b>Snap to nearest point</b>.</li><li>For centimeter accuracy an external RTK GNSS receiver is needed.</li></ul>`],
['Troubleshooting',`<ul><li><b>Black screen / “Camera could not start”</b>: open the app from its https address in Chrome or Safari (not inside a messenger or from a downloaded file) and allow the camera.</li><li><b>Nothing visible in AR</b>: check the “Items” count; use the project distance warning; make sure layers are checked in the panel; try Simulate.</li><li><b>Layer is in the wrong place</b>: the file’s coordinate system was wrong. Fix it in QGIS and re-import.</li><li><b>Lines look too high or too low</b>: keep “Show at real depth” off, use Snap to nearest point, then adjust Tilt trim and Field of view.</li><li><b>Map is blank</b>: no internet or the tile server is blocked; try another basemap.</li><li><b>Old version still shows</b>: close the app completely and open it twice after an update.</li></ul>`],
['Privacy and offline use',`<ul><li>All data stays on your device (browser storage). Use Backup to keep a copy.</li><li>After the first load the app works offline; only the basemap needs internet.</li><li>Install it from the browser menu: Add to Home screen.</li></ul>`]],
fa:[
['شروع سریع',`<ol><li>برنامه را باز کنید. در صفحه‌ی اول <b>ساخت پروژه‌ی جدید</b> را بزنید و نامی بنویسید.</li><li>پنل لایه‌ها را باز کنید (آیکون لایه‌ها در نوار بالا) و <b>+ محدوده</b> را بزنید.</li><li>روی ردیف محدوده <b>+ لایه</b> را بزنید و یک فایل GeoJSON، KML یا شیپ‌فایل (ZIP همراه prj.) انتخاب کنید.</li><li>نام، نوع، رنگ و عمق را تعیین کنید و <b>وارد کردن</b> را بزنید. لایه روی نقشه دیده می‌شود.</li><li>در نوار بالا <b>AR</b> و سپس <b>شروع AR با GPS</b> را بزنید. دوربین را به سمت زمین بگیرید تا لایه‌ها را ببینید.</li></ol>`],
['نوار بالا و منوی اصلی',`<ul><li><b>☰</b> منوی اصلی را باز می‌کند: پروژه‌ها، بستن پروژه، لایه‌ها، وارد کردن لایه، پشتیبان‌گیری، بازیابی پشتیبان، تنظیمات، درباره‌ی برنامه، راهنما.</li><li><b>نام پروژه</b> (با تعداد محدوده و لایه): با لمس آن فهرست پروژه‌ها باز می‌شود.</li><li><b>آیکون لایه‌ها</b>: پنل لایه‌ها را در سمت راست باز یا بسته می‌کند.</li><li><b>نقشه | AR</b>: بین نمای پلان روی نقشه و نمای دوربین (AR) جابه‌جا می‌شود.</li></ul>`],
['پروژه، محدوده و لایه',`<ul><li>هر <b>پروژه</b> یک یا چند <b>محدوده</b> دارد و هر محدوده چند <b>لایه</b> (هر فایل = یک لایه).</li><li><b>پروژه‌ها</b> (منو): انتخاب، تغییر نام، حذف یا ساخت پروژه. حذف پروژه همه‌ی محدوده‌ها و لایه‌هایش را پاک می‌کند.</li><li><b>بستن پروژه</b> به صفحه‌ی اول برمی‌گردد: باز کردن آخرین پروژه / ساخت پروژه‌ی جدید / انتخاب از بین پروژه‌های موجود / بازیابی از پشتیبان.</li><li>ردیف محدوده: تیک، کل محدوده را نشان یا پنهان می‌کند؛ <b>+ لایه</b> فایلی را در آن وارد می‌کند؛ <b>ویرایش</b> نام را عوض یا محدوده را حذف می‌کند.</li></ul>`],
['وارد کردن لایه',`<ul><li>منو ← <b>وارد کردن لایه</b>، یا <b>+ لایه</b> روی ردیف محدوده.</li><li>پشتیبانی‌شده: <b>GeoJSON</b> (WGS 84)، <b>KML</b> (WGS 84)، <b>شیپ‌فایل</b> به‌صورت ZIP که فایل prj. دارد (هر سیستم مختصاتی، خودکار تبدیل می‌شود).</li><li>پشتیبانی‌نشده: DXF، GPKG، TIFF و فرمت‌هایی که سیستم مختصات خود را اعلام نمی‌کنند. ZIP شیپ‌فایل بدون prj. یا GeoJSON با CRS دیگر با پیام خطا رد می‌شود.</li><li>پنجره‌ی وارد کردن: <b>نام</b>؛ <b>محدوده</b> برای قرارگرفتن لایه؛ <b>نوع</b> (آب، گاز، برق، مخابرات، فاضلاب، سایر — رنگ و عمق پیش‌فرض را تعیین می‌کند)؛ <b>رنگ</b>؛ <b>ضخامت خط</b>؛ <b>عمق</b> (متر زیر زمین، برای AR). خط زیر فیلدها نشان می‌دهد سیستم مختصات چگونه تشخیص داده شد.</li><li>اگر فایل فیلدی به نام label یا name داشته باشد، خودکار برای برچسب انتخاب می‌شود.</li></ul>`],
['تبدیل فرمت‌های دیگر (QGIS)',`<ol><li>فایل را در QGIS باز کنید و CRS درست را بگذارید (مثلاً EPSG:32640 برای UTM 40 شمالی).</li><li>روی لایه راست‌کلیک کنید ← Export ← Save Features As…</li><li>فرمت <b>GeoJSON</b> با CRS برابر EPSG:4326 را انتخاب کنید، یا <b>ESRI Shapefile</b> (همراه فایل prj. فشرده کنید).</li><li>خروجی را در برنامه وارد کنید.</li></ol>`],
['پنل لایه‌ها و نقشه‌ی پس‌زمینه',`<ul><li>پنل از سمت راست باز می‌شود. <b>✕</b> آن را می‌بندد.</li><li><b>نقشه‌ی پس‌زمینه</b>: خیابان (OpenStreetMap)، ماهواره (Esri)، ترکیبی (ماهواره + نام مکان‌ها)، توپوگرافی (OpenTopoMap)، بدون (خالی). به اینترنت نیاز دارد؛ کاشی‌هایی که قبلاً دیده‌اید ذخیره می‌مانند.</li><li>ردیف لایه: تیک = نمایش/پنهان، مربع رنگی = رنگ لایه (مربع شیب‌دار یعنی دسته‌بندی‌شده)، 🏷 فیلد برچسب را نشان می‌دهد، <b>⋮</b> یا لمس ردیف ویژگی‌های لایه را باز می‌کند.</li></ul>`],
['ویژگی‌های لایه',`<ul><li><b>نام</b>، <b>ضخامت خط</b>، <b>عمق (متر)</b> — فقط وقتی «نمایش در عمق واقعی» در AR روشن باشد استفاده می‌شود.</li><li><b>نمادگذاری ← نماد یکسان</b>: یک رنگ برای کل لایه.</li><li><b>نمادگذاری ← دسته‌بندی بر اساس ویژگی</b>: یک ویژگی را انتخاب کنید؛ هر مقدار متمایز رنگ خودش را می‌گیرد و می‌توانید آن را تغییر دهید. <i>رنگ پیش‌فرض</i> برای عارضه‌های بدون مقدار است.</li><li><b>نشانگر نقطه</b>: حلقه (در AR و نقشه) یا بدون نشانگر (فقط برچسب).</li><li><b>برچسب بر اساس</b>: ویژگی‌ای که متنش کنار هر عارضه نوشته می‌شود (نقشه: از زوم ۱۷ به بالا؛ AR: همیشه، در محدوده‌ی دید). «هیچ‌کدام» برچسب را خاموش می‌کند.</li><li><b>جدول ویژگی‌ها</b>: جدول ۱۵۰ عارضه‌ی اول.</li><li><b>زوم به</b> لایه را روی نقشه نشان می‌دهد. <b>حذف</b> آن را پاک می‌کند. <b>ذخیره</b> همه‌ی تغییرها را اعمال می‌کند.</li></ul>`],
['نمای نقشه',`<ul><li>نقطه‌ی آبی = موقعیت شما. برچسب بالا-چپ دقت GPS را نشان می‌دهد (±متر).</li><li><b>⤢</b> کل پروژه را نشان می‌دهد. <b>◎</b> روی موقعیت شما می‌رود (بار اول مجوز می‌خواهد).</li><li>روی یک خط یا نقطه بزنید تا ویژگی‌هایش در یک پنجره‌ی کوچک دیده شود.</li><li>با دو انگشت یا دابل‌تپ زوم کنید؛ مقیاس پایین-چپ است.</li></ul>`],
['نمای AR: شروع و اجزای صفحه',`<ul><li><b>AR</b> را بزنید. بار اول <b>شروع AR با GPS</b> (موقعیت واقعی) یا <b>شبیه‌سازی در محل پروژه (بدون GPS)</b> را انتخاب کنید (در وسط پروژه می‌ایستید و با دکمه‌های جهت‌دار راه می‌روید؛ برای آزمایش داخل ساختمان مناسب است). مجوز دوربین، مکان و حسگر حرکت را بدهید.</li><li><b>نوار اطلاعات بالا</b>: جهت (درجه‌ی قطب‌نما)، دقت GPS یا «شبیه‌سازی»، تعداد عناصر، فاصله تا نزدیک‌ترین خط.</li><li><b>نقشه‌ی کوچک گرد</b> (چپ): دید شما از بالا — مثلث سفید = شما، خط‌های رنگی = لایه‌ها، نقطه‌ها = نقطه‌ها. پیکان قرمز لبه‌ی آن وقتی پروژه دور است به سمت پروژه اشاره می‌کند.</li><li><b>نوار نارنجی</b>: هشدارها (مشکل دوربین، آماده‌نبودن GPS، دوربودن پروژه، نبودن قطب‌نما).</li><li>خط‌ها با رنگ لایه یا دسته نشان داده می‌شوند؛ حلقه‌ها نقطه‌ها را با فاصله به متر نشان می‌دهند؛ برچسب‌ها طبق تنظیم «برچسب بر اساس» هستند.</li></ul>`],
['دکمه‌ها و تنظیمات AR',`<ul><li><b>▲ ▼ ◀ ▶</b> (پایین-چپ): موقعیت شما را به اندازه‌ی <i>گام جابه‌جایی</i> به جلو، عقب، چپ یا راست (نسبت به جهت نگاه دوربین) می‌برد. برای جبران خطای GPS یا راه‌رفتن در حالت شبیه‌سازی.</li><li><b>چسباندن به نزدیک‌ترین نقطه</b>: شما را دقیقاً روی نزدیک‌ترین نقطه‌ی قابل‌نمایش (یا رأس خط) می‌گذارد. اول کنار یک منهول معلوم بایستید، بعد این دکمه را بزنید.</li><li><b>بازنشانی موقعیت</b>: همه‌ی جابه‌جایی‌های دستی را برمی‌گرداند.</li><li><b>راه‌اندازی دوباره‌ی دوربین</b>: دوباره سعی می‌کند دوربین را باز کند.</li><li><b>⚙ تنظیمات AR</b>: <i>تغییر عمق</i> (به عمق همه‌ی لایه‌ها اضافه یا کم می‌کند — فقط وقتی «نمایش در عمق واقعی» روشن است اثر دارد)، <i>ارتفاع چشم</i> (ارتفاع گوشی از زمین)، <i>زاویه‌ی دید دوربین</i> (اگر خط‌ها خیلی به هم نزدیک‌اند افزایش و اگر خیلی پراکنده‌اند کاهش دهید)، <i>تصحیح شیب</i> (خطای ثابت بالا/پایین را اصلاح می‌کند)، <i>گام جابه‌جایی</i>، و <i>نمایش در عمق واقعی</i> (خاموش = خط‌ها روی سطح زمین؛ روشن = زیر زمین در عمق هر لایه).</li></ul>`],
['تنظیمات، پشتیبان‌گیری و بازیابی',`<ul><li><b>تنظیمات</b>: زبان (English / فارسی) و پوسته (سیستم / روشن / تاریک). روی همین دستگاه ذخیره می‌شوند.</li><li><b>پشتیبان‌گیری (JSON)</b> همه‌ی پروژه‌ها را در یک فایل ذخیره می‌کند. <b>بازیابی پشتیبان</b> چنین فایلی را بارگذاری می‌کند (جایگزین داده‌ی فعلی می‌شود).</li></ul>`],
['رسیدن به دقت خوب',`<ul><li>GPS گوشی فقط چند متر دقت دارد و کنار ساختمان یا زیر درخت بدتر هم می‌شود. صبر کنید تا برچسب GPS عدد ± کوچکی نشان دهد.</li><li>قطب‌نما را با حرکت گوشی به شکل ∞ کالیبره کنید و از فلز و خودرو دور بایستید.</li><li>کنار یک نقطه‌ی معلوم بایستید و <b>چسباندن به نزدیک‌ترین نقطه</b> را بزنید.</li><li>برای دقت سانتی‌متری گیرنده‌ی GNSS خارجی با RTK لازم است.</li></ul>`],
['رفع اشکال',`<ul><li><b>صفحه‌ی سیاه / «دوربین باز نشد»</b>: برنامه را از آدرس https در Chrome یا Safari باز کنید (نه داخل پیام‌رسان یا فایل دانلودشده) و مجوز دوربین بدهید.</li><li><b>در AR چیزی دیده نمی‌شود</b>: عدد «عناصر» را ببینید؛ هشدار فاصله‌ی پروژه را بررسی کنید؛ لایه‌ها در پنل تیک داشته باشند؛ شبیه‌سازی را امتحان کنید.</li><li><b>لایه جای اشتباه است</b>: سیستم مختصات فایل اشتباه بوده. در QGIS اصلاح و دوباره وارد کنید.</li><li><b>خط‌ها خیلی بالا یا پایین‌اند</b>: «نمایش در عمق واقعی» را خاموش نگه دارید، چسباندن به نزدیک‌ترین نقطه را بزنید، سپس تصحیح شیب و زاویه‌ی دید را تنظیم کنید.</li><li><b>نقشه خالی است</b>: اینترنت نیست یا سرور نقشه مسدود است؛ نقشه‌ی پس‌زمینه‌ی دیگری را امتحان کنید.</li><li><b>نسخه‌ی قدیمی دیده می‌شود</b>: بعد از به‌روزرسانی برنامه را کامل ببندید و دو بار باز کنید.</li></ul>`],
['حریم خصوصی و کار آفلاین',`<ul><li>همه‌ی داده‌ها روی دستگاه شما (حافظه‌ی مرورگر) می‌ماند. برای نگه‌داشتن نسخه‌ی دیگر از پشتیبان‌گیری استفاده کنید.</li><li>بعد از بار اول، برنامه آفلاین هم کار می‌کند؛ فقط نقشه‌ی پس‌زمینه به اینترنت نیاز دارد.</li><li>از منوی مرورگر «افزودن به صفحه‌ی اصلی» را بزنید تا مثل یک برنامه نصب شود.</li></ul>`]]};
function help(){const L=HELP[SET.lang]||HELP.en;dlgShow(`<h3>${t('help')}</h3><div class=hp>${L.map(([h,b],i)=>`<details ${i==0?'open':''}><summary>${h}</summary>${b}</details>`).join('')}</div><div class=act><button class=pr id=hc>${t('ok')}</button></div>`);$('dlg').classList.add('w');$('hc').onclick=dlgClose}
function about(){dlgShow(`<div style='text-align:center'><img src=icon-192.png width=76 height=76 style='border-radius:18px'><h3 style='margin:8px 0 2px'>AR-Links</h3><div class=nt>${t('ver')} ${VER}</div></div><p>${t('abIntro')}</p><p><b>${t('dev')}:</b> Gologix</p><p>${t('abPriv')}</p><p class=nt>${t('abCred')}</p><p class=nt style='text-align:center'>© 2026 Gologix</p><div class=act><button class=pr id=abc>${t('ok')}</button></div>`);$('abc').onclick=dlgClose}
function settings(){dlgShow(`<h3>${t('settings')}</h3><label>${t('language')} <select id=sl><option value=en>English</option><option value=fa>فارسی</option></select></label><label>${t('theme')} <select id=sth>${['system','light','dark'].map(k=>`<option value=${k}>${t('th_'+k)}</option>`).join('')}</select></label><div class=act><button class=pr id=so>${t('ok')}</button></div>`);
 $('sl').value=SET.lang;$('sth').value=SET.theme;$('sth').onchange=e=>{SET.theme=e.target.value;saveSet();applyTheme()};
 $('sl').onchange=e=>{SET.lang=e.target.value;saveSet();applyLang();refresh();if(!$('wel').hidden)welcome();if(!$('sheet').hidden)sheet();settings()};$('so').onclick=dlgClose}
// ---- wiring
const dr=o=>{$('drawer').classList.toggle('o',!!o);$('scrim').hidden=!o};
$('mnu').onclick=()=>dr(1);$('scrim').onclick=()=>dr(0);
document.querySelectorAll('#drawer [data-go]').forEach(b=>b.onclick=()=>{dr(0);({proj:projects,close:welcome,lay:sheet,imp:impStart,bak:backup,res:()=>$('fb').click(),set:settings,help,about})[b.dataset.go]()});
$('pt0').onclick=projects;$('ttl').onclick=()=>S.open?projects():welcome();$('vm').onclick=()=>view('map');$('va').onclick=()=>view('ar');$('stc').onclick=()=>view('map');
$('lyb').onclick=()=>{if($('sheet').hidden)sheet();else $('sheet').hidden=true};
$('fx').onclick=()=>{S.fit=0;drawPlan()};
$('fl2').onclick=()=>{if(!navigator.geolocation){toast(t('locUnavail'));return}navigator.geolocation.getCurrentPosition(p=>{onGps(p);if(MAP)MAP.setView([p.coords.latitude,p.coords.longitude],Math.max(MAP.getZoom(),17))},()=>toast(t('locUnavail')),{enableHighAccuracy:true,timeout:15000})};
$('an').onclick=anchor;$('ud').onchange=e=>S.under=e.target.checked?1:0;$('pt').oninput=e=>{S.pt=+e.target.value;$('ptv').textContent=e.target.value};
MQ().addEventListener('change',applyTheme);
(async()=>{applyTheme();applyLang();await load();setArea(0);refresh();view('map');welcome();await needL();try{initMap();drawPlan()}catch(e){toast(t('mapFail'))}
 if(navigator.geolocation&&!S.gw){S.gw=1;navigator.geolocation.watchPosition(onGps,e=>{$('chip').textContent=t(e.code==1?'gpsDenied':'gpsNA')},{enableHighAccuracy:true,maximumAge:2000,timeout:30000})}
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})})();
</script></body></html>
